<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sophia's Recipes</title>
  <meta name="description" content="Recipes I don't want to forget."/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f97316"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <!-- Favicons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#f97316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="styles.css" as="style"/>
  <link rel="stylesheet" href="styles.css"/>

</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <svg class="logo-obj logo-plate" width="240" height="200" viewBox="0 0 240 200" role="img" aria-label="Sophia's Recipes logo" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="logo-shadow" cx="120" cy="160" rx="70" ry="14"/>
        <g transform-origin="120px 110px">
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="0 120 110;2 120 110;-2 120 110;0 120 110"
            dur="3.5s"
            repeatCount="indefinite"/>
          <ellipse class="logo-outer" cx="120" cy="110" rx="90" ry="70"/>
          <ellipse class="logo-rim" cx="120" cy="112" rx="82" ry="62"/>
          <ellipse class="logo-well" cx="120" cy="108" rx="72" ry="52"/>
          <ellipse class="logo-cheek" cx="92" cy="118" rx="8" ry="6"/>
          <ellipse class="logo-cheek" cx="148" cy="118" rx="8" ry="6"/>
          <ellipse class="logo-eye" cx="100" cy="108" rx="5" ry="7"/>
          <ellipse class="logo-eye" cx="140" cy="108" rx="5" ry="7"/>
          <g>
            <animate attributeName="opacity"
              values="1;1;0;1"
              dur="4s"
              repeatCount="indefinite"/>
            <ellipse class="logo-eye" cx="100" cy="108" rx="5" ry="7"/>
            <ellipse class="logo-eye" cx="140" cy="108" rx="5" ry="7"/>
          </g>
          <path class="logo-smile" d="M104 124 Q120 134 136 124" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="eyebrow">Recipe notebook</span>
        <h1>Sophia's Recipes</h1>
      </div>
      <span id="devPill" style="display:none;margin-left:.5rem;padding:.15rem .5rem;border-radius:999px;background:#eee;color:#333;font-size:.8rem;border:1px solid #ddd;">DEV</span>
    </div>
    <div class="search-wrap" role="search">
      <input class="search" id="searchInput" placeholder="Search recipes…" aria-label="Search recipes"/>
    </div>
    <div class="header-actions">
      <button class="btn theme-toggle" type="button" data-theme-toggle aria-pressed="false">Dark mode</button>
    </div>
  </div>
</header>
<main id="main" class="container">
  <section class="hero">
    <div class="hero-copy">
      <p class="hero-title">Weeknight flavors, written down.</p>
      <p class="hero-subtitle">A small collection of cozy, bold recipes with smart shortcuts and pantry-friendly ingredients.</p>
      <div class="hero-stats">
        <div>
          <span id="recipeCount">0</span>
          <small>recipes</small>
        </div>
        <div>
          <span id="tagCount">0</span>
          <small>tags</small>
        </div>
      </div>
    </div>
    <div class="filters" id="filters" aria-label="Recipe filters"></div>
  </section>
  <section class="recipe-grid" id="recipeGrid" aria-live="polite"></section>
  <p id="emptyState" class="empty" hidden>No recipes match your search/filter.</p>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <svg class="heart" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F6A8BC" d="M12.001 4.529c2.349-2.532 6.15-2.533 8.5 0 2.349 2.532 2.349 6.64 0 9.172l-6.79 7.33a2.36 2.36 0 0 1-3.42 0l-6.79-7.33c-2.349-2.532-2.349-6.64 0-9.172 2.35-2.533 6.151-2.533 8.5 0z"/></svg>
    <small>recipes I don't want to forget</small>
  </div>
</footer>
<div id="toastHost" aria-live="polite" aria-atomic="true"></div>
<script src="app.js" defer></script>
<script>
  // Show DEV pill on localhost/127.*
  if (/^(localhost|127\.)/.test(location.hostname)) {
    document.getElementById('devPill').style.display = 'inline-block';
  }
</script>
</body>
</html>
