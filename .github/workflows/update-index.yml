name: Update recipe index

on:
  push:
    paths:
      - "data/recipes/*.json"
      - "scripts/generate-index.js"

permissions:
  contents: write

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate index
        run: node scripts/generate-index.js

      - name: Commit changes
        run: |
          if git diff --quiet -- data/recipes/_index.json; then
            echo "No index changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recipes/_index.json
          git commit -m "chore: update recipes index"
          git push
