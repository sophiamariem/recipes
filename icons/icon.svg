<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- soft pink background -->
  <rect width="512" height="512" rx="96" fill="#FFE8EE"/>

  <!-- plate outer rim -->
  <ellipse cx="256" cy="268" rx="182" ry="142" fill="#FFF2F5"/>
  <!-- plate inner rim -->
  <ellipse cx="256" cy="274" rx="160" ry="120" fill="#FADDE5"/>
  <!-- plate well -->
  <ellipse cx="256" cy="262" rx="136" ry="96" fill="#FFFFFF"/>

  <!-- cheeks -->
